name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build polaris-market's wasm first
        # contracts/vault AND contracts/smart-wallet-factory both read
        # sibling contracts' compiled wasm as *files* at macro-expansion
        # time via `contractimport!`, even for a native `cargo test` build —
        # a dependency invisible to Cargo's own build graph (see the
        # identical steps in the wasm-build job below, and
        # contracts/vault/src/lib.rs, for why). A fresh CI runner has never
        # built anything, so `cargo test --workspace` fails outright without
        # this — confirmed live: this exact gap was in production, broken,
        # since the vault was first added, because every local run had
        # already built the wasm manually first and never hit it.
        run: cargo build --release --target wasm32v1-none -p polaris-market
      - name: Build the rest
        run: |
          cargo build --release --target wasm32v1-none \
            -p polaris-mock-lazer -p polaris-mock-redstone -p polaris-smart-wallet \
            -p polaris-smart-wallet-factory -p polaris-vault -p polaris-perpetual
      - run: cargo test --workspace

  wasm-build:
    name: release WASM builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build polaris-market first
        # polaris-vault's `contractimport!` reads polaris-market's compiled
        # wasm as a *file*, at macro-expansion time — a dependency invisible
        # to Cargo's own build graph (deliberately: a real Cargo dependency
        # on polaris-market here caused a wasm export symbol collision, see
        # contracts/vault/src/lib.rs). Cargo has no reason to order these
        # two builds relative to each other on its own, so this step is
        # split out and run first, explicitly, rather than trusting
        # incidental scheduling to keep working.
        run: cargo build --release --target wasm32v1-none -p polaris-market
      - name: Build the rest
        run: |
          cargo build --release --target wasm32v1-none \
            -p polaris-mock-lazer -p polaris-mock-redstone -p polaris-smart-wallet \
            -p polaris-smart-wallet-factory -p polaris-vault -p polaris-perpetual
