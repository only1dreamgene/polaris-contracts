name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm-build:
    name: release WASM builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build polaris-market first
        # polaris-vault's `contractimport!` reads polaris-market's compiled
        # wasm as a *file*, at macro-expansion time — a dependency invisible
        # to Cargo's own build graph (deliberately: a real Cargo dependency
        # on polaris-market here caused a wasm export symbol collision, see
        # contracts/vault/src/lib.rs). Cargo has no reason to order these
        # two builds relative to each other on its own, so this step is
        # split out and run first, explicitly, rather than trusting
        # incidental scheduling to keep working.
        run: cargo build --release --target wasm32v1-none -p polaris-market
      - name: Build the rest
        run: |
          cargo build --release --target wasm32v1-none \
            -p polaris-mock-lazer -p polaris-smart-wallet \
            -p polaris-smart-wallet-factory -p polaris-vault
