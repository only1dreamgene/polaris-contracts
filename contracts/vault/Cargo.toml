[package]
name = "polaris-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
# Not for its math (vault never calls any of it) — `contractimport!` in
# lib.rs needs `Asset` (a field type inside `polaris-market`'s exported
# `OracleFeedConfig`) resolvable in scope at the macro's invocation site;
# ctf-math is the canonical declaration, confirmed safe as a normal
# dependency here for the same reason it already is for `polaris-market`/
# `polaris-perpetual` — no `#[contract]` in it, so none of the
# wasm-symbol-collision hazard `market_contract`'s own doc comment
# describes for a *real* contract crate.
polaris-ctf-math = { path = "../ctf-math" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# polaris-market itself is NOT a dependency anywhere (see lib.rs's
# `market_contract` module doc for why) — its wasm is imported directly via
# `contractimport!`, which also supplies `market_contract::WASM` for tests
# to deploy a real market against, same file, one source of truth.
polaris-mock-lazer = { path = "../mock-lazer" }
